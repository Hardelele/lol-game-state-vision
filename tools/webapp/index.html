<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Смотрелка координат камеры</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect width=%2716%27 height=%2716%27 rx=%273%27 fill=%27%233a5bd9%27/%3E%3Ccircle cx=%278%27 cy=%278%27 r=%273%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="bar">
  <div class="pick">
    <span id="holdout" class="dot"></span>
    <select id="video" class="plain strong" title="ролик"></select>
    <span class="slash">/</span>
    <select id="run" class="plain" title="прогон"></select>
  </div>
  <div class="seg">
    <button id="mEnd" class="on" title="Tab">Сквозной</button>
    <button id="mNet" title="Tab">По слоям</button>
    <button id="mCh" title="Tab">Каналы</button>
  </div>
  <div class="stats">
    <span id="sMed"></span>
    <span title="промах меньше 0.05"><b id="sGood" class="ok"></b> <i>точно</i></span>
    <span title="промах больше половины кадра"><b id="sBad" class="bad"></b> <i>мимо</i></span>
    <button class="round small" id="helpBtn" title="клавиши — ?">?</button>
  </div>
</header>

<div class="vmeta" id="vmeta"></div>

<main class="frame" id="endview">
  <div class="panes">
    <div class="pane scenebox">
      <div class="phead">
        <b>Кадр</b><i>вход модели</i>
        <span class="grow"></span>
        <button class="tog on" id="grid" title="сетка ячеек — G">сетка</button>
        <button class="tog dim" id="cells" title="размер ячеек">8×5</button>
      </div>
      <div class="holder">
        <img id="scene" alt="вход модели">
        <svg id="sceneGrid" viewBox="0 0 100 100"></svg>
        <div id="cellTip" class="celltip hidden"></div>
      </div>
    </div>
    <div class="pane mapbox">
      <div class="phead">
        <b>Карта</b><i>истина и ответ</i>
        <span class="grow"></span>
        <button class="tog on" id="heat" title="распределение вероятности — H">тепло</button>
        <button class="tog" id="trail" title="след камеры — T">след</button>
      </div>
      <div class="holder">
        <img id="mini" alt="миникарта">
        <img id="heatimg" alt="">
        <svg id="mapSvg" viewBox="0 0 1 1"></svg>
      </div>
    </div>
  </div>
  <div class="facts">
    <div class="fact hl" data-lit="link" title="промах — расстояние между истиной и ответом">
      <i>промах</i><b id="vErr" class="big"></b><i id="vUnits"></i>
    </div>
    <div class="fact hl" data-lit="true" title="истина">
      <span class="ring"></span><span id="vTrue"></span>
    </div>
    <div class="fact hl" data-lit="pred" title="ответ модели">
      <span class="plus">+</span><span id="vPred"></span>
    </div>
    <div class="fact" title="разброс ответа"><i>разброс</i><span id="vSpread"></span></div>
    <div class="fact" title="качество метки"><i>качество</i><span id="vQ"></span></div>
    <span id="vLabel" class="chip hidden" title="ручная метка"></span>
    <span class="grow"></span>
    <a id="why" class="out" target="_blank" rel="noopener" title="отчёт о том, почему модель промахнулась на этом кадре">разобрать ↗</a>
    <a id="yt" class="out" target="_blank" rel="noopener" title="открыть момент на YouTube">YouTube ↗</a>
  </div>
</main>

<section id="netview" class="frame netview hidden">
  <div class="stagebar">
    <button class="round" id="stPrev" title="[">◀</button>
    <div class="stname">
      <div id="stName">—</div>
      <div class="mono" id="stShape"></div>
    </div>
    <button class="round" id="stNext" title="]">▶</button>
    <div class="groups" id="pipe"></div>
  </div>
  <div class="netrow">
    <div class="netcol">
      <div class="nhead"><i>вход</i><span id="inName"></span>
        <span class="grow"></span><span class="mono" id="inShape"></span></div>
      <div class="sheet"><img id="inGrid" alt="вход этапа"></div>
    </div>
    <div class="netcol">
      <div class="nhead"><i>выход</i><span id="outName"></span>
        <span class="grow"></span><span class="mono" id="outShape"></span></div>
      <div class="sheet"><img id="outGrid" alt="выход этапа" class="clickable"
        title="каждая клетка — одна карта признаков; нажмите, чтобы рассмотреть"></div>
    </div>
    <div class="netcol zoom">
      <div class="nhead"><i>канал</i><b id="chNo">—</b><i id="chTotal"></i>
        <span class="grow"></span>
        <button class="bare" id="chPrev">◀</button>
        <button class="bare" id="chNext">▶</button></div>
      <div class="sheet"><img id="chBig" alt="канал крупно"></div>
      <div class="chstats" id="chStats"></div>
      <div class="kern hidden" id="kernBox"
        title="ядро свёртки: по плитке на входной канал, оранжевое — плюс, синее — минус">
        <img id="kernImg" alt="ядро">
      </div>
    </div>
  </div>
  <div class="note"><span id="stNote"></span>
    <button class="bare link" id="whyBtn">подробнее</button></div>
  <p class="whytxt hidden" id="explain"></p>
</section>


<section id="chview" class="frame chview hidden">
  <div class="chcols">

    <aside class="chcol chans">
      <div class="chhead">
        <b>Каналы</b> <i id="chCount"></i>
        <span class="grow"></span>
        <button class="bare" id="chOnlyMine" title="только те, с которых уже брали">наши</button>
      </div>
      <input id="chSearch" class="search" placeholder="чемпион или @канал"
             autocomplete="off">
      <div class="chlist" id="chList"></div>
      <div class="addrow">
        <input id="chAdd" class="search" placeholder="ссылка или @имя канала"
               autocomplete="off">
        <button class="pill" id="chAddBtn">добавить</button>
      </div>
      <div id="chMsg" class="msg"></div>
    </aside>

    <div class="chcol vids">
      <div class="chhead">
        <b id="vidsOf">выберите канал</b> <i id="vidsCount"></i>
        <span class="grow"></span>
        <select id="vLimit" class="plain" title="сколько последних роликов брать">
          <option value="30">30</option>
          <option value="60" selected>60</option>
          <option value="120">120</option>
          <option value="300">300</option>
        </select>
        <button class="bare" id="vRefresh" title="перечитать с YouTube">↻</button>
      </div>
      <input id="vSearch" class="search" placeholder="название, соперник, патч"
             autocomplete="off">
      <div class="rolerow" id="roleRow"></div>
      <div class="vidlist" id="vidList"></div>
    </div>

    <div class="chcol player">
      <div class="chhead">
        <b>Просмотр</b> <i id="pId"></i>
        <span class="grow"></span>
        <a id="pYt" class="out" target="_blank" rel="noopener">YouTube ↗</a>
      </div>
      <div class="ytbox" id="ytbox"><div class="ytnone">ролик не выбран</div></div>
      <div class="pmeta" id="pmeta"></div>
      <div class="prow">
        <button class="pill" id="pTake"
          title="кадры с координатами собираются потоком, файл на диск не пишется">
          взять в датасет потоком</button>
        <select id="pFps" class="plain" title="кадров в секунду ролика">
          <option value="0.5">0.5 кадр/с</option>
          <option value="1" selected>1 кадр/с</option>
          <option value="2">2 кадр/с</option>
        </select>
        <button class="pill go" id="pLive"
          title="смотреть ответ модели по этому ролику прямо сейчас: кадры идут потоком, на диск ничего не пишется">
          смотреть потоком ▶</button>
        <button class="pill" id="pOpen">открыть в смотрелке</button>
      </div>
      <div class="jobs" id="jobs"></div>
    </div>

  </div>
</section>

<section class="frame strip" id="stripview">
  <div class="navrow">
    <button class="round" id="prev" title="← (Shift — 10 кадров)">◀</button>
    <button class="round play" id="play" title="пробел">▶</button>
    <button class="round" id="next" title="→ (Shift — 10 кадров)">▶</button>
    <input id="jump" type="text" title="перейти: кадр или 12:30">
    <span class="pos"><span id="posNo"></span> <span class="faint" id="posTotal"></span></span>
    <span class="grow"></span>
    <i>шагать по</i>
    <button class="pill" id="fErr" title="только крупные промахи">промахам</button>
    <button class="pill" id="fUns" title="только кадры, где модель сомневается">сомнениям</button>
    <button class="pill" id="fLab" title="только с ручной меткой">меткам</button>
  </div>
  <div id="film" class="film"></div>
  <div class="tlbox">
    <canvas id="tl"></canvas>
    <div id="hov" class="hov hidden">
      <img id="hovImg" alt="">
      <div><span id="hovTime"></span><span id="hovErr"></span></div>
    </div>
  </div>
</section>

<div id="help" class="help hidden">
  <div class="keys" id="keys"></div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
