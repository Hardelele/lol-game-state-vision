# Два пакета и скрипты к ним:
# * lolvision — модель и данные (геометрия, модели, чекпоинты, ответ по кадру,
#   маска HUD, метка с миникарты, чтение наборов);
# * lolstream — ролики YouTube поверх модели: поток кадров, live, каналы,
#   забор в датасет, сервер смотрелки (статика webapp/ — данные пакета);
# * tools/ — командная строка, `python tools/<script>.py`; в пакет не входят и
#   без установки находят пакеты через tools/_bootstrap.py.
#
# Установка для разработки: `python -m pip install -e .` (зависимости — из
# requirements.txt; CUDA-сборку PyTorch ставить до этого, см. там же).

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lol-game-state-vision"
version = "0.1.0"
description = "Camera position on the League of Legends map from a single frame"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools]
packages = ["lolvision", "lolstream"]

[tool.setuptools.package-data]
lolstream = ["webapp/*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies = {dev = {file = ["requirements-dev.txt"]}}

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "tools"]

[tool.ruff.lint]
# BLE и N включены, чтобы стоящие в коде `# noqa: BLE001` / `# noqa: N802`
# что-то значили.
select = ["E", "F", "W", "B", "BLE", "N"]
ignore = [
    "N803", "N806",  # H, W, A и т.п. — обозначения из геометрии, не константы
    "N812",          # import torch.nn.functional as F — общепринято
    "E731",          # короткая lambda-переменная внутри функции
    "B905",          # zip без strict: длины совпадают по построению
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
